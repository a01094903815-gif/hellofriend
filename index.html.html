<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>맞춤형 프로그램 출결 관리</title>
<style>
:root{--bg:#f4f5f7;--fg:#1f2937;--muted:#6b7280;--line:#e5e7eb;--primary:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--fg);font-size:15px;line-height:1.5}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:18px;margin:0}
header .sub{color:var(--muted);font-size:13px;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:8px;font-size:15px;cursor:pointer;font-family:inherit;color:var(--fg)}
nav button.on{background:var(--primary);border-color:var(--primary);color:#fff}
main{padding:16px;max-width:1280px;margin:0 auto}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
.panel h2{font-size:16px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:12px}
.btn{border:1px solid #cbd5e1;background:#fff;padding:9px 14px;border-radius:8px;font-size:15px;cursor:pointer;font-family:inherit;color:var(--fg);display:inline-block}
.btn:hover{background:#f8fafc}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{color:#dc2626;border-color:#fca5a5}
.btn.sm{padding:5px 10px;font-size:13px}
input,select,textarea{font-family:inherit;font-size:15px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:var(--fg)}
textarea{width:100%;min-height:70px}
.muted{color:var(--muted)}
.small{font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);border-left:4px solid var(--pc,var(--primary));background:#fff;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:15px;font-family:inherit;color:var(--fg)}
.chip.on{background:var(--pc,var(--primary));color:#fff;border-color:var(--pc,var(--primary))}
.chip small{opacity:.75}
.ptitle{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:17px}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block}
.warn{background:#fffbeb;border:1px solid #fcd34d;color:#92400e;padding:8px 12px;border-radius:6px;margin-bottom:10px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scard{background:#fff;border:2px solid;border-radius:10px;padding:12px;cursor:pointer;user-select:none;-webkit-user-select:none;min-height:120px;display:flex;flex-direction:column;gap:4px}
.scard:active{transform:scale(.98)}
.sname{font-size:19px;font-weight:700}
.sbadge{align-self:flex-start;color:#fff;font-weight:700;padding:3px 10px;border-radius:6px;font-size:14px;margin-top:4px}
.note{font-size:12px;color:#b45309}
.rbtn{margin-top:auto;border:1px dashed #9ca3af;background:#fff;border-radius:6px;padding:4px 6px;font-size:13px;cursor:pointer;font-family:inherit}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;white-space:nowrap}
th{background:#f8fafc;font-weight:600;position:sticky;top:0;z-index:1}
td.num,th.num{text-align:right}
td.c,th.c{text-align:center}
.tw{overflow:auto;max-height:520px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.bar{display:grid;grid-template-columns:150px 1fr 60px;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{background:#f1f5f9;border-radius:4px;height:18px;overflow:hidden}
.bf{height:100%}
.bv{text-align:right;font-weight:600}
.link{color:var(--primary);cursor:pointer;text-decoration:underline}
.flag{display:inline-block;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:4px;padding:0 6px;font-size:12px;margin-left:4px}
.tag{display:inline-block;border:1px solid;border-radius:4px;padding:0 6px;font-size:12px;margin:1px 2px}
.sym{font-weight:700;font-size:15px}
.legend span{margin-right:12px;font-size:13px}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 12px;overflow:auto}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:10px;padding:20px;width:100%;max-width:620px}
#modal h3{margin:0 0 12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form > label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.full{grid-column:1/-1}
.ck{display:inline-flex;align-items:center;gap:6px;margin:4px 12px 4px 0;font-size:15px;color:var(--fg)}
.ckbox{border:1px solid var(--line);border-radius:6px;padding:6px 10px;max-height:180px;overflow:auto}
#lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;align-items:center;justify-content:center}
#lock.show{display:flex}
</style>
</head>
<body>
<header>
  <h1>맞춤형 프로그램 출결 관리</h1>
  <span class="sub" id="school"></span>
  <nav>
    <button data-t="board" onclick="go('board')">출결 관리판</button>
    <button data-t="dash" onclick="go('dash')">현황 대시보드</button>
    <button data-t="students" onclick="go('students')">학생 관리</button>
    <button data-t="programs" onclick="go('programs')">프로그램 관리</button>
    <button data-t="settings" onclick="go('settings')">설정</button>
    <button id="lockBtn" onclick="lockNow()" style="display:none">잠금</button>
  </nav>
</header>
<main id="main"></main>

<div id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="mbox"></div></div>

<div id="lock">
  <div class="panel" style="width:300px;text-align:center">
    <h2 style="text-align:center">PIN 입력</h2>
    <input id="pinIn" type="password" inputmode="numeric" maxlength="4" style="font-size:24px;text-align:center;width:160px;letter-spacing:8px" onkeydown="if(event.key==='Enter')unlock()">
    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn primary" onclick="unlock()">열기</button></div>
    <div id="pinMsg" class="small" style="color:#dc2626;margin-top:8px"></div>
  </div>
</div>

<script>
/* ===== 기본 상수 ===== */
const KEY = 'programAttendance_v1';               // localStorage 저장 키
const ST = {                                       // 출결 상태 정의
  U: { t: '미확인', c: '#9ca3af', sym: '·' },
  P: { t: '출석',   c: '#16a34a', sym: '○' },
  L: { t: '지각',   c: '#d97706', sym: '△' },
  A: { t: '결석',   c: '#dc2626', sym: '×' },
  E: { t: '조퇴',   c: '#7c3aed', sym: '◇' }
};
const ORDER = ['U', 'P', 'L', 'A', 'E'];           // 카드를 누를 때 바뀌는 순서
const REASONS = ['질병', '가정사정', '학교행사', '무단', '기타'];
const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
const DEFAULT_SETTINGS = { school: '', pin: '', threshold: 80, streak: 3 };

/* ===== 화면 상태 ===== */
let D = null;                 // 전체 데이터
let tab = 'board';
let bDate = '';               // 출결판 날짜
let bProg = null;             // 출결판 프로그램
let dPeriod = '4w', dFrom = '', dTo = '', dProg = 'all';   // 대시보드 필터
const $ = id => document.getElementById(id);
const MAIN = $('main');

/* ===== 유틸 ===== */
function uid() { return Math.random().toString(36).slice(2, 10); }
function fmt(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parse(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function today() { return fmt(new Date()); }
function dlabel(ds) { const d = parse(ds); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + DAYS[d.getDay()] + ')'; }
function timeStr(iso) {
  const d = new Date(iso);
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function getS(id) { return D.students.find(s => s.id === id); }
function getP(id) { return D.programs.find(p => p.id === id); }
function bySeat(a, b) { return (a.grade - b.grade) || (a.cls - b.cls) || (a.num - b.num) || a.name.localeCompare(b.name); }
function studentsOf(pid) { return D.students.filter(s => s.programs.includes(pid)).sort(bySeat); }
function progsOn(ds) { const wd = parse(ds).getDay(); return D.programs.filter(p => p.days.includes(wd)); }

/* ===== 저장/불러오기 ===== */
function save() { localStorage.setItem(KEY, JSON.stringify(D)); }
function load() {
  try { D = JSON.parse(localStorage.getItem(KEY)); } catch (e) { D = null; }
  if (!D) { D = sample(); save(); }
  D.settings = Object.assign({}, DEFAULT_SETTINGS, D.settings || {});
}

/* ===== 샘플 데이터: 프로그램 3개, 학생 15명, 지난 2주 기록 ===== */
function sample() {
  const programs = [
    { id: 'p1', name: '창의 로봇 코딩', teacher: '김민수', room: '과학실', days: [1, 3], time: '14:00-15:20', color: '#2563eb' },
    { id: 'p2', name: '기초 학력 튼튼 국어', teacher: '이서연', room: '3-2 교실', days: [2, 4], time: '14:00-14:40', color: '#0891b2' },
    { id: 'p3', name: '놀이 체육', teacher: '박지훈', room: '강당', days: [1, 2, 3, 4, 5], time: '13:30-14:30', color: '#059669' }
  ];
  const names = ['김하늘', '이도윤', '박서준', '최지우', '정하린', '강시우', '조예린', '윤건우', '장수아', '임준서', '한지민', '오태윤', '서하은', '신우진', '권나연'];
  const students = names.map((n, i) => ({
    id: 's' + (i + 1), name: n, grade: 3 + (i % 3), cls: 1 + (i % 4), num: i + 1,
    phone: '010-0000-' + (1000 + i), programs: [], note: ''
  }));
  students.forEach((s, i) => {
    if (i < 8) s.programs.push('p1');
    if (i >= 5) s.programs.push('p2');
    if (i % 2 === 0) s.programs.push('p3');
  });
  students[3].note = '땅콩 알레르기';
  students[9].note = '보호자 동행 귀가';
  let seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const att = {};
  const t = new Date();
  for (let k = 14; k >= 1; k--) {
    const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - k);
    const ds = fmt(d);
    programs.forEach(p => {
      if (!p.days.includes(d.getDay())) return;
      const recs = {};
      students.filter(s => s.programs.includes(p.id)).forEach(s => {
        const r = rnd();
        let st = r < 0.82 ? 'P' : r < 0.89 ? 'L' : r < 0.96 ? 'A' : 'E';
        if (s.id === 's7' && k <= 7) st = 'A';          // 관심 학생 예시
        const o = { s: st };
        if (st === 'A' || st === 'E') o.reason = s.id === 's7' ? '질병' : REASONS[Math.floor(rnd() * 4)];
        recs[s.id] = o;
      });
      att[ds + '|' + p.id] = { recs: recs, savedAt: new Date(d.getFullYear(), d.getMonth(), d.getDate(), 15, 0).toISOString() };
    });
  }
  return { settings: Object.assign({}, DEFAULT_SETTINGS, { school: '○○초등학교' }), programs, students, att };
}

/* ===== 공통 렌더 ===== */
function go(t) { tab = t; render(); window.scrollTo(0, 0); }
function render() {
  document.querySelectorAll('nav button[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('school').textContent = (D.settings.school || '') + ' · 오늘 ' + dlabel(today());
  $('lockBtn').style.display = D.settings.pin ? '' : 'none';
  ({ board: renderBoard, dash: renderDash, students: renderStudents, programs: renderPrograms, settings: renderSettings })[tab]();
}
function modal(h) { $('mbox').innerHTML = h; $('modal').classList.add('show'); }
function closeModal() { $('modal').classList.remove('show'); }
function tile(l, v, c) { return '<div class="stat"><div class="l">' + l + '</div><div class="v" style="color:' + (c || 'inherit') + '">' + v + '</div></div>'; }
function count(rs) { const c = { U: 0, P: 0, L: 0, A: 0, E: 0 }; rs.forEach(r => c[r.s]++); return c; }
// 출석률 = (출석+지각+조퇴) ÷ (미확인 제외 기록 수)
function rate(rs) {
  const v = rs.filter(r => r.s !== 'U');
  if (!v.length) return null;
  return Math.round(v.filter(r => r.s !== 'A').length / v.length * 1000) / 10;
}

/* ===== 1. 출결 관리판 ===== */
function renderBoard() {
  if (!D.programs.length) {
    MAIN.innerHTML = '<div class="panel">등록된 프로그램이 없습니다. <span class="link" onclick="go(\'programs\')">프로그램 관리</span>에서 먼저 등록해 주세요.</div>';
    return;
  }
  if (!bProg || !getP(bProg)) { const on = progsOn(bDate); bProg = (on[0] || D.programs[0]).id; }
  const p = getP(bProg);
  const list = studentsOf(p.id);
  const a = D.att[bDate + '|' + p.id] || { recs: {} };
  const cnt = { U: 0, P: 0, L: 0, A: 0, E: 0 };
  list.forEach(s => cnt[(a.recs[s.id] || { s: 'U' }).s]++);
  const onIds = progsOn(bDate).map(x => x.id);

  const chips = D.programs.map(x =>
    `<button class="chip ${x.id === bProg ? 'on' : ''}" style="--pc:${x.color}" onclick="pickProg('${x.id}')">${esc(x.name)}${onIds.includes(x.id) ? '' : ' <small>(비운영일)</small>'}</button>`
  ).join('');

  const cards = list.map(s => {
    const r = a.recs[s.id] || { s: 'U' };
    const st = ST[r.s];
    return `<div class="scard" style="border-color:${st.c};background:${r.s === 'U' ? '#fff' : st.c + '14'}" onclick="cycle('${s.id}')">
      <div class="sname">${esc(s.name)}</div>
      <div class="muted small">${s.grade}-${s.cls} · ${s.num}번</div>
      <div class="sbadge" style="background:${st.c}">${st.t}</div>
      ${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}
      ${(r.s === 'A' || r.s === 'E') ? `<button class="rbtn" onclick="event.stopPropagation();openReason('${s.id}')">${r.reason ? '사유: ' + esc(r.reason) + (r.memo ? ' · 메모' : '') : '사유 입력'}</button>` : ''}
    </div>`;
  }).join('');

  MAIN.innerHTML = `
  <div class="panel row">
    <label class="row">날짜 <input type="date" value="${bDate}" onchange="if(this.value){bDate=this.value;render()}"></label>
    <button class="btn" onclick="shiftDate(-1)">◀ 전날</button>
    <button class="btn" onclick="bDate=today();render()">오늘</button>
    <button class="btn" onclick="shiftDate(1)">다음날 ▶</button>
    <span class="muted">${dlabel(bDate)}</span>
  </div>
  <div class="chips">${chips}</div>
  <div class="panel">
    <div class="ptitle"><span class="dot" style="background:${p.color}"></span><b>${esc(p.name)}</b>
      <span class="muted small">${esc(p.teacher)} · ${esc(p.room)} · ${p.days.map(d => DAYS[d]).join('')} ${esc(p.time)}</span></div>
    ${onIds.includes(p.id) ? '' : '<div class="warn">선택한 날짜는 이 프로그램의 운영 요일이 아닙니다. 보강 수업이라면 그대로 입력하셔도 됩니다.</div>'}
    <div class="stats">
      ${tile('재적', list.length)}${tile('출석', cnt.P, ST.P.c)}${tile('지각', cnt.L, ST.L.c)}
      ${tile('결석', cnt.A, ST.A.c)}${tile('조퇴', cnt.E, ST.E.c)}${tile('미확인', cnt.U, ST.U.c)}
    </div>
    <div class="row">
      <button class="btn primary" onclick="allPresent()">전체 출석 (미확인 학생)</button>
      <button class="btn" onclick="clearDay()">이 날 기록 지우기</button>
      <span class="muted small">${a.savedAt ? '저장 완료 ' + timeStr(a.savedAt) : '아직 저장된 기록이 없습니다.'}</span>
    </div>
    <p class="muted small" style="margin:8px 0 0">카드를 누를 때마다 미확인 → 출석 → 지각 → 결석 → 조퇴 순서로 바뀌며, 바뀔 때마다 자동 저장됩니다. 결석·조퇴 카드의 '사유 입력'을 누르면 사유와 메모를 남길 수 있습니다.</p>
  </div>
  ${list.length ? `<div class="cards">${cards}</div>` : '<div class="panel muted">이 프로그램에 배정된 학생이 없습니다. 학생 관리 또는 프로그램 관리에서 학생을 배정해 주세요.</div>'}`;
}
function shiftDate(n) { const d = parse(bDate); d.setDate(d.getDate() + n); bDate = fmt(d); render(); }
function pickProg(id) { bProg = id; render(); }
function dayRec() {
  const k = bDate + '|' + bProg;
  if (!D.att[k]) D.att[k] = { recs: {} };
  return D.att[k];
}
function touch(a) { a.savedAt = new Date().toISOString(); save(); render(); }
function cycle(sid) {
  const a = dayRec();
  const r = a.recs[sid] || { s: 'U' };
  r.s = ORDER[(ORDER.indexOf(r.s) + 1) % ORDER.length];
  if (r.s !== 'A' && r.s !== 'E') { delete r.reason; delete r.memo; }
  if (r.s === 'U') delete a.recs[sid]; else a.recs[sid] = r;
  touch(a);
}
function allPresent() {
  const a = dayRec();
  studentsOf(bProg).forEach(s => { if (!a.recs[s.id]) a.recs[s.id] = { s: 'P' }; });
  touch(a);
}
function clearDay() {
  if (!confirm(dlabel(bDate) + ' ' + getP(bProg).name + ' 출결 기록을 모두 지울까요?')) return;
  delete D.att[bDate + '|' + bProg];
  save(); render();
}
function openReason(sid) {
  const r = dayRec().recs[sid];
  const s = getS(sid);
  modal(`<h3>${esc(s.name)} · ${ST[r.s].t} 사유</h3>
    <div class="chips" id="rChips">${REASONS.map(x => `<button class="chip ${r.reason === x ? 'on' : ''}" data-v="${x}" onclick="document.querySelectorAll('#rChips .chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${x}</button>`).join('')}</div>
    <label class="small muted">메모<textarea id="rMemo" placeholder="예: 보호자 전화 확인, 14:20 조퇴">${esc(r.memo || '')}</textarea></label>
    <div class="row end"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveReason('${sid}')">저장</button></div>`);
}
function saveReason(sid) {
  const a = dayRec();
  const r = a.recs[sid];
  const on = document.querySelector('#rChips .chip.on');
  r.reason = on ? on.dataset.v : '';
  r.memo = $('rMemo').value.trim();
  closeModal(); touch(a);
}

/* ===== 2. 현황 대시보드 ===== */
function range() {
  const t = parse(today());
  let f, to = fmt(t);
  if (dPeriod === 'today') f = to;
  else if (dPeriod === 'week') { const d = new Date(t); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); f = fmt(d); }
  else if (dPeriod === 'month') f = fmt(new Date(t.getFullYear(), t.getMonth(), 1));
  else if (dPeriod === '4w') { const d = new Date(t); d.setDate(d.getDate() - 27); f = fmt(d); }
  else { f = dFrom || fmt(new Date(t.getFullYear(), t.getMonth(), 1)); to = dTo || to; }
  return [f, to];
}
function collect(f, t, prog) {
  const out = [];
  for (const k in D.att) {
    const sp = k.split('|'), d = sp[0], pid = sp[1];
    if (d < f || d > t) continue;
    if (prog !== 'all' && pid !== prog) continue;
    const recs = D.att[k].recs;
    for (const sid in recs) {
      if (!getS(sid)) continue;
      out.push(Object.assign({ d: d, pid: pid, sid: sid }, recs[sid]));
    }
  }
  return out;
}
// 가장 최근부터 이어진 연속 결석 횟수
function streakOf(sid, pid) {
  const ks = Object.keys(D.att).filter(k => (!pid || k.endsWith('|' + pid)) && D.att[k].recs[sid] && D.att[k].recs[sid].s !== 'U').sort();
  let n = 0;
  for (let i = ks.length - 1; i >= 0; i--) { if (D.att[ks[i]].recs[sid].s === 'A') n++; else break; }
  return n;
}
function barsHTML(items) {
  if (!items.length) return '<p class="muted">프로그램이 없습니다.</p>';
  return items.map(it => `<div class="bar"><div class="bl" title="${esc(it.label)}">${esc(it.label)}</div>
    <div class="bt"><div class="bf" style="width:${it.v == null ? 0 : it.v}%;background:${it.c}"></div></div>
    <div class="bv">${it.v == null ? '-' : it.v + '%'}</div></div>`).join('');
}
function lineSVG(pts) {
  if (!pts.length) return '<p class="muted">선택한 기간에 기록이 없습니다.</p>';
  const W = 640, H = 230, pl = 40, pr = 14, pt = 14, pb = 30;
  const lo = Math.min.apply(null, pts.map(p => p.v));
  const mn = Math.max(0, Math.floor((lo - 5) / 10) * 10), mx = 100;
  const iw = W - pl - pr, ih = H - pt - pb;
  const X = i => pl + (pts.length === 1 ? iw / 2 : i * iw / (pts.length - 1));
  const Y = v => pt + (mx - v) / ((mx - mn) || 1) * ih;
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = mn + (mx - mn) * i / 4, y = Y(v);
    g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="#e5e7eb"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="#6b7280">${Math.round(v)}%</text>`;
  }
  const every = Math.ceil(pts.length / 8);
  pts.forEach((p, i) => {
    if (i % every === 0) g += `<text x="${X(i)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="#6b7280">${dlabel(p.d).slice(0, -3)}</text>`;
  });
  const th = D.settings.threshold;
  if (th >= mn) g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(th)}" y2="${Y(th)}" stroke="#dc2626" stroke-dasharray="4 4"/><text x="${W - pr}" y="${Y(th) - 4}" text-anchor="end" font-size="11" fill="#dc2626">기준 ${th}%</text>`;
  g += `<polyline points="${pts.map((p, i) => X(i) + ',' + Y(p.v)).join(' ')}" fill="none" stroke="#2563eb" stroke-width="2"/>`;
  g += pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.v)}" r="3.5" fill="#2563eb"><title>${dlabel(p.d)} ${p.v}%</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="날짜별 출석률 추이">${g}</svg>`;
}
function renderDash() {
  const rg = range(), f = rg[0], t = rg[1];
  const th = D.settings.threshold, sk = D.settings.streak;
  if (dProg !== 'all' && !getP(dProg)) dProg = 'all';
  const all = collect(f, t, 'all');
  const rs = dProg === 'all' ? all : all.filter(r => r.pid === dProg);
  const c = count(rs);
  const sessions = new Set(rs.map(r => r.d + '|' + r.pid)).size;
  const total = rate(rs);
  const scope = (dProg === 'all' ? D.students.slice() : studentsOf(dProg)).sort(bySeat);
  const rows = scope.map(s => {
    const mine = rs.filter(r => r.sid === s.id);
    const rt = rate(mine), st = streakOf(s.id, dProg === 'all' ? null : dProg);
    return { s: s, c: count(mine), rt: rt, st: st, flag: (rt !== null && rt < th) || st >= sk };
  });
  const risk = rows.filter(r => r.flag);
  const bars = D.programs.map(p => ({ label: p.name, v: rate(all.filter(r => r.pid === p.id)), c: p.color }));
  const dates = Array.from(new Set(rs.map(r => r.d))).sort();
  const pts = dates.map(d => ({ d: d, v: rate(rs.filter(r => r.d === d)) })).filter(p => p.v !== null);
  const PER = [['today', '오늘'], ['week', '이번 주'], ['month', '이번 달'], ['4w', '최근 4주'], ['custom', '직접 지정']];

  let grid = '';
  if (dProg !== 'all') {
    const idx = {};
    rs.forEach(r => { idx[r.sid + '|' + r.d] = r; });
    grid = `<div class="panel"><h2>학생별 출결표 · ${esc(getP(dProg).name)}</h2>
      <div class="legend" style="margin-bottom:8px">${['P', 'L', 'A', 'E'].map(k => `<span style="color:${ST[k].c}"><b>${ST[k].sym}</b> ${ST[k].t}</span>`).join('')}</div>
      <div class="tw"><table><thead><tr><th>학생</th>${dates.map(d => `<th class="c">${dlabel(d)}</th>`).join('')}<th class="num">출석률</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td><span class="link" onclick="showStudent('${r.s.id}')">${esc(r.s.name)}</span>${r.flag ? '<span class="flag">관심</span>' : ''}</td>
        ${dates.map(d => { const x = idx[r.s.id + '|' + d]; const s = x ? x.s : 'U'; return `<td class="c sym" style="color:${ST[s].c}" title="${ST[s].t}${x && x.reason ? ' · ' + esc(x.reason) : ''}${x && x.memo ? ' · ' + esc(x.memo) : ''}">${x ? ST[s].sym : ''}</td>`; }).join('')}
        <td class="num">${r.rt == null ? '-' : r.rt + '%'}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  }

  MAIN.innerHTML = `
  <div class="panel"><div class="row">
    ${PER.map(x => `<button class="btn ${dPeriod === x[0] ? 'primary' : ''}" onclick="dPeriod='${x[0]}';render()">${x[1]}</button>`).join('')}
    ${dPeriod === 'custom' ? `<input type="date" value="${f}" onchange="dFrom=this.value;render()"> ~ <input type="date" value="${t}" onchange="dTo=this.value;render()">` : ''}
    <select onchange="dProg=this.value;render()"><option value="all">전체 프로그램</option>${D.programs.map(p => `<option value="${p.id}" ${dProg === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
    <span class="muted small">${f} ~ ${t}</span>
  </div></div>
  <div class="stats">
    ${tile('출석률', total == null ? '-' : total + '%', total != null && total < th ? '#dc2626' : '')}
    ${tile('운영 회차', sessions)}${tile('출석', c.P, ST.P.c)}${tile('지각', c.L, ST.L.c)}
    ${tile('결석', c.A, ST.A.c)}${tile('조퇴', c.E, ST.E.c)}${tile('관심 학생', risk.length, risk.length ? '#dc2626' : '')}
  </div>
  <div class="grid2">
    <div class="panel" style="margin:0"><h2>프로그램별 출석률</h2>${barsHTML(bars)}</div>
    <div class="panel" style="margin:0"><h2>날짜별 출석률 추이${dProg === 'all' ? '' : ' · ' + esc(getP(dProg).name)}</h2>${lineSVG(pts)}</div>
  </div>
  <div style="height:12px"></div>
  <div class="panel"><h2>관심 학생 <span class="muted small">출석률 ${th}% 미만 또는 ${sk}회 이상 연속 결석</span></h2>
    ${risk.length ? `<div class="tw"><table><thead><tr><th>학생</th><th>학년-반</th><th class="num">출석률</th><th class="num">현재 연속 결석</th><th>해당 기준</th></tr></thead><tbody>
    ${risk.map(r => `<tr><td><span class="link" onclick="showStudent('${r.s.id}')">${esc(r.s.name)}</span></td><td>${r.s.grade}-${r.s.cls}</td>
      <td class="num">${r.rt == null ? '-' : r.rt + '%'}</td><td class="num">${r.st}회</td>
      <td class="small">${[r.rt !== null && r.rt < th ? '출석률 기준 미달' : '', r.st >= sk ? '연속 결석' : ''].filter(Boolean).join(', ')}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="muted">해당하는 학생이 없습니다.</p>'}
  </div>
  ${grid}
  <div class="panel"><h2>학생별 요약</h2><div class="tw"><table><thead><tr><th>학생</th><th>학년-반-번호</th><th>참여 프로그램</th>
    <th class="num">출석</th><th class="num">지각</th><th class="num">결석</th><th class="num">조퇴</th><th class="num">출석률</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td><span class="link" onclick="showStudent('${r.s.id}')">${esc(r.s.name)}</span>${r.flag ? '<span class="flag">관심</span>' : ''}</td>
      <td>${r.s.grade}-${r.s.cls}-${r.s.num}</td><td>${progTags(r.s)}</td>
      <td class="num">${r.c.P}</td><td class="num">${r.c.L}</td><td class="num">${r.c.A}</td><td class="num">${r.c.E}</td>
      <td class="num">${r.rt == null ? '-' : r.rt + '%'}</td></tr>`).join('')}
  </tbody></table></div></div>`;
}
function progTags(s) {
  return s.programs.map(id => { const p = getP(id); return p ? `<span class="tag" style="border-color:${p.color};color:${p.color}">${esc(p.name)}</span>` : ''; }).join('');
}
function showStudent(sid) {
  const s = getS(sid);
  const rs = collect('0000-00-00', '9999-99-99', 'all').filter(r => r.sid === sid).sort((a, b) => b.d.localeCompare(a.d));
  const c = count(rs), rt = rate(rs);
  modal(`<h3>${esc(s.name)} <span class="muted small">${s.grade}학년 ${s.cls}반 ${s.num}번</span></h3>
    <p class="small muted">보호자 연락처 ${esc(s.phone || '-')}<br>참여 프로그램 ${progTags(s) || '-'}${s.note ? '<br>특이사항: ' + esc(s.note) : ''}</p>
    <div class="stats">${tile('전체 출석률', rt == null ? '-' : rt + '%')}${tile('출석', c.P, ST.P.c)}${tile('지각', c.L, ST.L.c)}${tile('결석', c.A, ST.A.c)}${tile('조퇴', c.E, ST.E.c)}${tile('연속 결석', streakOf(sid, null))}</div>
    <div class="tw" style="max-height:320px"><table><thead><tr><th>날짜</th><th>프로그램</th><th>상태</th><th>사유 · 메모</th></tr></thead><tbody>
    ${rs.map(r => `<tr><td>${dlabel(r.d)}</td><td>${esc((getP(r.pid) || {}).name || '(삭제됨)')}</td><td style="color:${ST[r.s].c};font-weight:700">${ST[r.s].t}</td><td class="small">${esc([r.reason, r.memo].filter(Boolean).join(' · '))}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">기록이 없습니다.</td></tr>'}
    </tbody></table></div>
    <div class="row end"><button class="btn" onclick="closeModal()">닫기</button></div>`);
}

/* ===== 3. 학생 관리 ===== */
function progChecks(sel) {
  return D.programs.map(p => `<label class="ck"><input type="checkbox" value="${p.id}" ${sel.includes(p.id) ? 'checked' : ''}> <span style="color:${p.color}">■</span> ${esc(p.name)}</label>`).join('') || '<span class="muted small">등록된 프로그램이 없습니다.</span>';
}

  </tbody></table></div></div>`;

function filterRows(q) {
  document.querySelectorAll('#stbl tbody tr[data-n]').forEach(tr => { tr.style.display = tr.dataset.n.includes(q.trim()) ? '' : 'none'; });
}
function studentForm(id) {
  const s = id ? getS(id) : { name: '', grade: '', cls: '', num: '', phone: '', programs: [], note: '' };
  modal(`<h3>${id ? '학생 정보 수정' : '학생 추가'}</h3>
  <div class="form">
    <label>이름<input id="fName" value="${esc(s.name)}"></label>

    <label>학년<input id="fGrade" type="number" min="1" value="${esc(s.grade)}"></label>
    <label>반<input id="fCls" type="number" min="1" value="${esc(s.cls)}"></label>

    <label class="full">특이사항<textarea id="fNote" placeholder="건강, 귀가 방법 등">${esc(s.note)}</textarea></label>
  </div>

}
function saveStudent(id) {
  const name = $('fName').value.trim();
  if (!name) { alert('이름을 입력해 주세요.'); return; }
  const o = {
    name: name, grade: Number($('fGrade').value) || 0, cls: Number($('fCls').value) || 0, num: Number($('fNum').value) || 0,
    phone: $('fPhone').value.trim(), note: $('fNote').value.trim(),
    programs: Array.from(document.querySelectorAll('#fProgs input:checked')).map(x => x.value)
  };
  if (id) Object.assign(getS(id), o); else D.students.push(Object.assign({ id: uid() }, o));
  save(); closeModal(); render();
}
function delStudent(id) {
  const s = getS(id);
  if (!confirm(s.name + ' 학생과 출결 기록을 모두 삭제할까요?')) return;
  D.students = D.students.filter(x => x.id !== id);
  for (const k in D.att) delete D.att[k].recs[id];
  save(); render();
}
function bulkForm() {
  modal(`<h3>학생 일괄 등록</h3>
  <p class="small muted">엑셀에서 표를 복사해 붙여 넣거나 CSV 파일을 불러오세요.<br>열 순서: 이름, 학년, 반, 번호, 보호자 연락처, 특이사항 (첫 줄이 '이름'으로 시작하면 제목 줄로 보고 건너뜁니다.)</p>
  <textarea id="bText" style="min-height:160px" placeholder="김하늘&#9;3&#9;1&#9;5&#9;010-1234-5678"></textarea>
  <div class="row" style="margin:8px 0"><input type="file" accept=".csv,.txt" onchange="readCSV(this)"></div>
  <div class="small muted">등록하는 학생 모두에게 배정할 프로그램</div>
  <div class="ckbox" id="fProgs">${progChecks([])}</div>
  <div class="row end"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="doBulk()">등록</button></div>`);
}
function readCSV(inp) {
  const f = inp.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const txt = r.result;
    if (txt.indexOf('\ufffd') >= 0) {            // 한글 깨짐이면 EUC-KR로 다시 읽기
      const r2 = new FileReader();
      r2.onload = () => { $('bText').value = r2.result; };
      r2.readAsText(f, 'euc-kr');
    } else {
      $('bText').value = txt.replace(/^\ufeff/, '');
    }
  };
  r.readAsText(f, 'utf-8');
}
function doBulk() {
  const progs = Array.from(document.querySelectorAll('#fProgs input:checked')).map(x => x.value);
  const lines = $('bText').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let added = 0, updated = 0;
  lines.forEach((l, i) => {
    const c = l.split(/\t|,/).map(x => x.trim().replace(/^"|"$/g, ''));
    if (!c[0] || (i === 0 && c[0] === '이름')) return;
    const g = Number(c[1]) || 0, cl = Number(c[2]) || 0, n = Number(c[3]) || 0;
    const ex = D.students.find(s => s.name === c[0] && s.grade === g && s.cls === cl && s.num === n);
    if (ex) { progs.forEach(p => { if (!ex.programs.includes(p)) ex.programs.push(p); }); updated++; return; }
    D.students.push({ id: uid(), name: c[0], grade: g, cls: cl, num: n, phone: c[4] || '', note: c[5] || '', programs: progs.slice() });
    added++;
  });
  save(); closeModal(); render();
  alert('새로 등록 ' + added + '명, 기존 학생 프로그램 추가 ' + updated + '명');
}

  modal(`<h3>${id ? '프로그램 수정' : '프로그램 추가'}</h3>

    <label>장소(교실)<input id="gRoom" value="${esc(p.room)}"></label>
    <label>운영 시간<input id="gTime" value="${esc(p.time)}" placeholder="14:00-15:20"></label>
    <label>색상<input id="gColor" type="color" value="${p.color}" style="height:40px;padding:2px"></label>
    <div class="full"><div class="small muted">운영 요일</div><div id="gDays">${[1, 2, 3, 4, 5, 6].map(d => `<label class="ck"><input type="checkbox" value="${d}" ${p.days.includes(d) ? 'checked' : ''}> ${DAYS[d]}</label>`).join('')}</div></div>
    <div class="full"><div class="small muted">참여 학생</div><div class="ckbox" id="gStu">${ss.map(s => `<label class="ck"><input type="checkbox" value="${s.id}" ${id && s.programs.includes(id) ? 'checked' : ''}> ${esc(s.name)} <span class="muted small">${s.grade}-${s.cls}</span></label>`).join('') || '<span class="muted small">등록된 학생이 없습니다.</span>'}</div></div>
  </div>
  <div class="row end"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveProgram('${id || ''}')">저장</button></div>`);
}
function saveProgram(id) {
  const name = $('gName').value.trim();
  if (!name) { alert('프로그램명을 입력해 주세요.'); return; }
  const o = {
    name: name, teacher: $('gTeacher').value.trim(), room: $('gRoom').value.trim(), time: $('gTime').value.trim(), color: $('gColor').value,
    days: Array.from(document.querySelectorAll('#gDays input:checked')).map(x => Number(x.value))
  };
  let pid = id;
  if (id) Object.assign(getP(id), o); else { pid = uid(); D.programs.push(Object.assign({ id: pid }, o)); }
  const chosen = Array.from(document.querySelectorAll('#gStu input:checked')).map(x => x.value);
  D.students.forEach(s => {
    const has = s.programs.includes(pid), want = chosen.includes(s.id);
    if (want && !has) s.programs.push(pid);
    if (!want && has) s.programs = s.programs.filter(x => x !== pid);
  });
  save(); closeModal(); render();
}
function delProgram(id) {
  const p = getP(id);
  if (!confirm(p.name + ' 프로그램과 출결 기록을 모두 삭제할까요?')) return;
  D.programs = D.programs.filter(x => x.id !== id);
  D.students.forEach(s => { s.programs = s.programs.filter(x => x !== id); });
  Object.keys(D.att).forEach(k => { if (k.endsWith('|' + id)) delete D.att[k]; });
  if (bProg === id) bProg = null;
  save(); render();
}

/* ===== 5. 설정 / 내보내기 / 백업 ===== */
function renderSettings() {
  const ym = today().slice(0, 7);
  MAIN.innerHTML = `
  <div class="panel"><h2>기본 설정</h2><div class="form">
    <label class="full">학교명<input id="sSchool" value="${esc(D.settings.school)}"></label>
    <label>관심 학생 기준 출석률(%)<input id="sTh" type="number" min="0" max="100" value="${D.settings.threshold}"></label>
    <label>관심 학생 기준 연속 결석(회)<input id="sSt" type="number" min="1" value="${D.settings.streak}"></label>
  </div><div class="row end"><button class="btn primary" onclick="saveSettings()">저장</button></div></div>

  <div class="panel"><h2>월별 출석부</h2><div class="row">
    <input type="month" id="eMonth" value="${ym}">
    <select id="eProg">${D.programs.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
    <button class="btn" onclick="exportCSV()">엑셀(CSV) 내려받기</button>
    <button class="btn" onclick="printSheet()">인쇄용 출석부</button>
  </div><p class="small muted" style="margin:8px 0 0">운영 요일과 실제 기록된 날짜가 열로 들어갑니다. 출석률 = (출석+지각+조퇴) ÷ 기록된 수업 수</p></div>

  <div class="panel"><h2>PIN 잠금</h2>
    <p class="small muted">현재 PIN 잠금이 <b>${D.settings.pin ? '켜져' : '꺼져'}</b> 있습니다. 켜 두면 앱을 열 때 숫자 4자리를 입력해야 합니다. 같은 기기를 여러 사람이 쓸 때 화면을 가리는 간단한 잠금이며, 데이터 암호화 기능은 아닙니다.</p>
    <div class="row"><input id="sPin" type="password" inputmode="numeric" maxlength="4" placeholder="숫자 4자리">
      <button class="btn" onclick="setPin()">PIN 설정</button>${D.settings.pin ? '<button class="btn" onclick="clearPin()">PIN 해제</button>' : ''}</div></div>

  <div class="panel"><h2>백업과 복원</h2>
    <p class="small muted">데이터는 이 브라우저에만 저장됩니다. 브라우저 기록을 지우거나 다른 기기를 쓰면 데이터가 보이지 않으니 정기적으로 백업해 주세요.</p>
    <div class="row"><button class="btn" onclick="backup()">JSON 백업 파일 내려받기</button>
      <label class="btn">백업 파일로 복원<input type="file" accept=".json,application/json" style="display:none" onchange="restore(this)"></label></div></div>

  <div class="panel"><h2>데이터 초기화</h2>
    <div class="row"><button class="btn" onclick="resetSample()">샘플 데이터로 되돌리기</button><button class="btn danger" onclick="wipe()">데이터 전체 삭제</button></div></div>`;
}
function saveSettings() {
  D.settings.school = $('sSchool').value.trim();
  D.settings.threshold = Math.min(100, Math.max(0, Number($('sTh').value) || 80));
  D.settings.streak = Math.max(1, Number($('sSt').value) || 3);
  save(); render(); alert('저장했습니다.');
}
function setPin() {
  const v = $('sPin').value.trim();
  if (!/^\d{4}$/.test(v)) { alert('숫자 4자리를 입력해 주세요.'); return; }
  D.settings.pin = v; save(); render(); alert('PIN을 설정했습니다.');
}
function clearPin() { D.settings.pin = ''; save(); render(); }
function lockNow() { if (D.settings.pin) { $('pinMsg').textContent = ''; $('lock').classList.add('show'); setTimeout(() => $('pinIn').focus(), 50); } }
function unlock() {
  if ($('pinIn').value === D.settings.pin) { $('lock').classList.remove('show'); $('pinMsg').textContent = ''; }
  else $('pinMsg').textContent = 'PIN이 맞지 않습니다.';
  $('pinIn').value = '';
}
function monthSheet(ym, pid) {
  const p = getP(pid), ss = studentsOf(pid);
  const ymd = ym.split('-').map(Number), y = ymd[0], m = ymd[1];
  const set = new Set();
  const last = new Date(y, m, 0).getDate();
  for (let d = 1; d <= last; d++) { const dt = new Date(y, m - 1, d); if (p.days.includes(dt.getDay())) set.add(fmt(dt)); }
  Object.keys(D.att).forEach(k => { const sp = k.split('|'); if (sp[1] === pid && sp[0].startsWith(ym)) set.add(sp[0]); });
  const dates = Array.from(set).sort();
  const rows = ss.map(s => {
    const cells = dates.map(d => { const a = D.att[d + '|' + pid]; return a && a.recs[s.id] ? a.recs[s.id].s : 'U'; });
    const c = { U: 0, P: 0, L: 0, A: 0, E: 0 };
    cells.forEach(x => c[x]++);
    const v = c.P + c.L + c.A + c.E;
    return { s: s, cells: cells, c: c, rt: v ? Math.round((v - c.A) / v * 1000) / 10 : null };
  });
  return { p: p, dates: dates, rows: rows };
}
function exportCSV() {
  const pid = $('eProg').value, ym = $('eMonth').value;
  if (!pid || !ym) { alert('월과 프로그램을 선택해 주세요.'); return; }
  const ms = monthSheet(ym, pid);
  const head = ['학년', '반', '번호', '이름'].concat(ms.dates.map(dlabel), ['출석', '지각', '결석', '조퇴', '출석률(%)']);
  const lines = [head].concat(ms.rows.map(r => [r.s.grade, r.s.cls, r.s.num, r.s.name]
    .concat(r.cells.map(x => x === 'U' ? '' : ST[x].sym), [r.c.P, r.c.L, r.c.A, r.c.E, r.rt == null ? '' : r.rt])));
  const csv = lines.map(l => l.map(v => { v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\r\n');
  download('출석부_' + ms.p.name + '_' + ym + '.csv', '\ufeff' + csv, 'text/csv;charset=utf-8');
}
function printSheet() {
  const pid = $('eProg').value, ym = $('eMonth').value;
  if (!pid || !ym) { alert('월과 프로그램을 선택해 주세요.'); return; }
  const ms = monthSheet(ym, pid), p = ms.p;
  const w = window.open('', '_blank');
  if (!w) { alert('팝업이 차단되었습니다. 브라우저에서 팝업을 허용해 주세요.'); return; }
  const html = `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>출석부 ${esc(p.name)} ${ym}</title><style>
    @page{size:A4 landscape;margin:12mm}
    body{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:11px;color:#000;margin:0}
    h1{font-size:18px;text-align:center;margin:0 0 8px}
    .meta{display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px}
    table{border-collapse:collapse;width:100%}
    th,td{border:1px solid #000;padding:3px 2px;text-align:center}
    td.n{text-align:left;padding-left:4px;white-space:nowrap}
    .bottom{display:flex;justify-content:space-between;align-items:flex-start;margin-top:10px}
    .sign{width:auto}.sign td{width:80px;height:46px}
  </style></head><body>
  <h1>${esc(D.settings.school)} ${esc(p.name)} 출석부 (${ym.slice(0, 4)}년 ${Number(ym.slice(5))}월)</h1>
  <div class="meta"><span>강사: ${esc(p.teacher)} · 장소: ${esc(p.room)} · 운영: ${p.days.map(d => DAYS[d]).join('')} ${esc(p.time)}</span><span>재적 ${ms.rows.length}명</span></div>
  <table><thead><tr><th>연번</th><th>학년-반</th><th>이름</th>${ms.dates.map(d => `<th>${dlabel(d).replace('(', '<br>(')}</th>`).join('')}<th>출석</th><th>지각</th><th>결석</th><th>조퇴</th><th>출석률</th></tr></thead><tbody>
  ${ms.rows.map((r, i) => `<tr><td>${i + 1}</td><td>${r.s.grade}-${r.s.cls}</td><td class="n">${esc(r.s.name)}</td>${r.cells.map(x => `<td>${x === 'U' ? '' : ST[x].sym}</td>`).join('')}<td>${r.c.P}</td><td>${r.c.L}</td><td>${r.c.A}</td><td>${r.c.E}</td><td>${r.rt == null ? '' : r.rt + '%'}</td></tr>`).join('')}
  </tbody></table>
  <div class="bottom"><div>○ 출석 &nbsp; △ 지각 &nbsp; × 결석 &nbsp; ◇ 조퇴<br>출석률 = (출석+지각+조퇴) ÷ 기록된 수업 수</div>
  <table class="sign"><tr><th>담당 강사</th><th>담당 교사</th><th>교감</th></tr><tr><td></td><td></td><td></td></tr></table></div>
  </body></html>`;
  w.document.open(); w.document.write(html); w.document.close();
  setTimeout(() => { w.focus(); w.print(); }, 400);
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type }));
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function backup() { download('출결관리_백업_' + today() + '.json', JSON.stringify(D, null, 2), 'application/json'); }
function restore(inp) {
  const f = inp.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const x = JSON.parse(r.result);
      if (!x.programs || !x.students || !x.att) throw new Error('bad');
      if (!confirm('현재 데이터를 백업 파일 내용으로 바꿉니다. 계속할까요?')) return;
      D = x; D.settings = Object.assign({}, DEFAULT_SETTINGS, D.settings || {});
      bProg = null; save(); render(); alert('복원했습니다.');
    } catch (e) { alert('올바른 백업 파일이 아닙니다.'); }
  };
  r.readAsText(f);
}
function resetSample() {
  if (!confirm('현재 데이터를 지우고 샘플 데이터로 되돌릴까요?')) return;
  D = sample(); bProg = null; save(); render();
}
function wipe() {
  if (!confirm('모든 프로그램, 학생, 출결 기록을 삭제합니다. 되돌릴 수 없습니다. 계속할까요?')) return;
  D = { settings: Object.assign({}, DEFAULT_SETTINGS), programs: [], students: [], att: {} };
  bProg = null; save(); render();
}

/* ===== 시작 ===== */
load();
bDate = today();
render();
lockNow();
</script>
</body>
</html>
